<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividades - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .header-mr {
            background-color: #0d6efd;
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Actividades</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="container py-4">
        <!-- TABLA DEL CRUD (LISTAR, EDITAR, ELIMINAR) -->
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 950px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="mb-0">Actividades Registradas</h5>
                    <span class="badge bg-primary" id="contadorActividades">0 actividades</span>
                </div>
                <button type="button" id="nuevaActividad" class="btn btn-primary btn-sm d-none">
                    <i class="bi bi-plus-lg"></i> Nueva actividad
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Actividad</th>
                            <th>Fecha</th>
                            <th>Municipio</th>
                            <th>Total Recaudado</th>
                            <th id="encabezadoAcciones" class="text-center d-none">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-actividades">
                        <tr>
                            <td colspan="5" class="text-center text-muted">No hay actividades registradas aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL PARA NUEVA / EDITAR ACTIVIDAD -->
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formActividad">
                    <div class="modal-header">
                        <h5 class="modal-title" id="tituloModalActividad">Nueva actividad</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="idActividad">
                        <div class="mb-3">
                            <label for="nombreActividad" class="form-label">Nombre de la actividad</label>
                            <input type="text" id="nombreActividad" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="fechaEvento" class="form-label">Fecha del evento</label>
                            <input type="date" id="fechaEvento" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="municipio" class="form-label">Municipio</label>
                            <select id="municipio" class="form-select" required>
                                <option value="">Seleccione</option>
                                <option value="Paipa">Paipa</option>
                                <option value="Sogamoso">Sogamoso</option>
                                <option value="Duitama">Duitama</option>
                                <option value="Tunja">Tunja</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="totalRecaudado" class="form-label">Total recaudado</label>
                            <input type="number" id="totalRecaudado" class="form-control" min="0" step="0.01" placeholder="Ej.: 1500000.00">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/Actividades.js"></script>
</body>
</html>
