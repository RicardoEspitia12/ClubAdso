<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividades - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-mr {
            background-color: #0d6efd;
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Actividades</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="container py-4">
        <!-- FORMULARIO ORIGINAL DE REGISTRO / EDICIÓN -->
        <div class="card shadow-sm p-4 mx-auto mb-4" style="max-width: 700px;">
            <h4 class="mb-4" id="tituloFormulario">Datos de la actividad</h4>
            <form id="formActividad">
                <input type="hidden" id="indiceEdicion" value="-1">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombreActividad" class="form-label">Nombre de la actividad</label>
                        <input type="text" id="nombreActividad" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="fechaEvento" class="form-label">Fecha del evento</label>
                        <input type="date" id="fechaEvento" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="municipio" class="form-label">Municipio</label>
                        <select id="municipio" class="form-select" required>
                            <option value="">Seleccione</option>
                            <option value="Paipa">Paipa</option>
                            <option value="Sogamoso">Sogamoso</option>
                            <option value="Duitama">Duitama</option>
                            <option value="Tunja">Tunja</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="campoTotalRecaudado">
                        <label for="totalRecaudado" class="form-label">Total recaudado</label>
                        <input type="number" id="totalRecaudado" class="form-control" min="0" step="0.01" placeholder="Ej.: 1500000.00" required>
                    </div>
                    <div class="col-12">
                        <label for="participantes" class="form-label">Asociados que participaron</label>
                        <select id="participantes" class="form-select" multiple size="4">
                            <option value="1025528723">1025528723 - Admin MR</option>
                            <option value="1025528724">1025528724 - Juan Pérez</option>
                        </select>
                        <div class="form-text">Mantén Ctrl para elegir varios</div>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <button type="reset" id="btnLimpiar" class="btn btn-secondary">Limpiar</button>
                    <button type="submit" id="guardarActividad" class="btn btn-primary">Guardar actividad</button>
                </div>
            </form>
        </div>

        <!-- TABLA DEL CRUD (LISTAR, EDITAR, ELIMINAR) -->
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 950px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Actividades Registradas</h5>
                <span class="badge bg-primary" id="contadorActividades">0 actividades</span>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Actividad</th>
                            <th>Fecha</th>
                            <th>Municipio</th>
                            <th>Total Recaudado</th>
                            <th>Participantes</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaActividades">
                        <tr>
                            <td colspan="6" class="text-center text-muted">No hay actividades registradas aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Controladores/Actividades.js">
      
    </script>
</body>
</html>
