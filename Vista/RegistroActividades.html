<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividades - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/formularios.css">
</head>
<body>

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Registro de Actividades</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card form-card naranja shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex align-items-center mb-4">
                            <i class="bi bi-calendar-event icono-titulo text-warning me-3"></i>
                            <div>
                                <h4 class="mb-0">Nueva actividad</h4>
                                <small class="text-muted">Eventos del club para recaudar dinero</small>
                            </div>
                        </div>

                        <form id="formActividad" action="" method="POST">

                            
                            <h6 class="text-secondary mb-3">Datos del evento</h6>
                            <div class="row g-3">

                                <div class="col-md-8">
                                    <label for="nombreActividad" class="form-label">Nombre de la actividad</label>
                                    <input type="text" class="form-control" id="nombreActividad"
                                           placeholder="Ej: Bingo bailable" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="fechaEvento" class="form-label">Fecha del evento</label>
                                    <input type="date" class="form-control" id="fechaEvento" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="municipio" class="form-label">Municipio</label>
                                    <select class="form-select" id="municipio" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Paipa">Paipa</option>
                                        <option value="Sogamoso">Sogamoso</option>
                                        <option value="Duitama">Duitama</option>
                                        <option value="Tunja">Tunja</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="lugar" class="form-label">Lugar</label>
                                    <input type="text" class="form-control" id="lugar" placeholder="Ej: Salón comunal">
                                </div>

                            </div>

                            <hr class="my-4">

                            
                            <h6 class="text-secondary mb-3">Recaudo</h6>
                            <div class="row g-3">

                                <div class="col-md-4">
                                    <label for="totalRecaudado" class="form-label">Total recaudado</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" id="totalRecaudado"
                                               min="0" step="1000" placeholder="Ej: 2000000" required>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label for="fondoClub" class="form-label">Fondo del club (50%)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="text" class="form-control" id="fondoClub" readonly>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label for="repartir" class="form-label">A repartir (50%)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="text" class="form-control" id="repartir" readonly>
                                    </div>
                                </div>

                            </div>

                            <hr class="my-4">

                            
                            <h6 class="text-secondary mb-3">Asociados que participaron</h6>

                            <div class="input-group mb-3">
                                <input type="number" class="form-control" id="documentoParticipante"
                                       placeholder="Documento del asociado">
                                <button class="btn btn-outline-warning" type="button">
                                    <i class="bi bi-person-plus"></i> Agregar
                                </button>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-sm table-striped align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Documento</th>
                                            <th>Nombres y apellidos</th>
                                            <th class="text-end">Quitar</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        

                                        <tr>
                                            <td>1025528724</td>
                                            <td>Juan Pérez</td>
                                            <td class="text-end">
                                                <button type="button" class="btn btn-sm btn-outline-danger">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-4">
                                <button type="reset" class="btn btn-outline-secondary">
                                    <i class="bi bi-eraser"></i> Limpiar
                                </button>
                                <button type="submit" class="btn btn-warning">
                                    <i class="bi bi-check-circle"></i> Guardar actividad
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
