<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Club</title>

    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>

<body>
    <div>
        <div class="text-center mb-4">
            <h2>Iniciar Sesión</h2>
            <p class="text-muted">Portal de Asociados - Acerías</p>
        </div>

        <!-- Se quitó el action para que JavaScript maneje el envío por fetch -->
        <form id="formLogin">

            <div class="grupo-input mb-3">
                <label for="documento" class="form-label fw-semibold text-secondary">
                    Ingresar Documento:
                </label>

                <input
                    type="number"
                    id="documento"
                    name="documento"
                    class="form-control"
                    placeholder="Ejemplo: 1025528723"
                    required
                >
            </div>

            <div class="grupo-input mb-4">
                <label for="password" class="form-label fw-semibold text-secondary">
                    Contraseña:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Ingrese su contraseña"
                    required
                >
            </div>

            <div class="grupo-botones d-grid gap-2">
                <button
                    type="submit"
                    id="btnIngresar"
                    class="btn btn-primary fw-bold py-2"
                >
                    Ingresar al Sistema
                </button>
            </div>

            <div class="text-center mt-3">
                <a href="#" id="enlaceRegistro" class="text-decoration-none small">
                    ¿No tienes cuenta? Regístrate aquí
                </a>
            </div>
           <p id="mensajeLogin" class="text-danger mt-3 mb-0" role="alert"></p>

        </form>
    </div>

    <script src="../Assets/js/login.js"></script>
</body>

<script src="../Controladores/login.js"></script>
</html>
