<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Club de Asociados</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* Fondo con imagen por link + filtro oscuro para que no moleste a la vista */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(11, 19, 41, 0.75), rgba(11, 19, 41, 0.85)), 
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* Tarjeta de login con márgenes claros y sombra profunda (no se fusiona con el fondo) */
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px 35px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .icono-club {
            width: 60px;
            height: 60px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        .btn-ingresar {
            background-color: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .btn-ingresar:hover {
            background-color: #0b5ed7;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    
    <!-- TARJETA DEL LOGIN -->
    <div class="login-card">
        
        <div class="text-center mb-4">
            <div class="icono-club">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Iniciar Sesión</h3>
            <p class="text-muted small">Portal de Asociados - Club Acerías</p>
        </div>

        <form id="formLogin">

            <!-- Permite tanto Documento como Correo -->
            <div class="mb-3">
                <label for="documento" class="form-label fw-semibold text-secondary small">
                    Documento o Correo Electrónico:
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0" style="border-radius: 10px 0 0 10px;">
                        <i class="bi bi-person"></i>
                    </span>
                    <input
                        type="text"
                        id="documento"
                        name="documento"
                        class="form-control border-start-0"
                        placeholder="Ej: 1025528723 o correo@gmail.com"
                        required
                    >
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">
                    Contraseña:
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0" style="border-radius: 10px 0 0 10px;">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control border-start-0"
                        placeholder="Ingrese su contraseña"
                        required
                    >
                </div>
            </div>

            <div class="d-grid gap-2 mb-3">
                <button
                    type="submit"
                    id="btnIngresar"
                    class="btn btn-primary btn-ingresar fw-bold text-white shadow-sm"
                >
                    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
                </button>
            </div>

            <!-- ENLACE AL REGISTRO CONECTADO -->
            <div class="text-center mt-3">
                <a href="Registro.html" id="enlaceRegistro" class="text-decoration-none small fw-semibold text-primary">
                    ¿No tienes cuenta? Regístrate aquí
                </a>
            </div>

            <p id="mensajeLogin" class="text-danger small text-center mt-3 mb-0" role="alert"></p>

        </form>
    </div>

    <!-- SCRIPT DEL CONTROLADOR -->
    <script src="../Controladores/login.js"></script>
</body>
</html>
