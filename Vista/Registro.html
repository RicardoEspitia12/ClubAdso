<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asociado - Club</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(11, 19, 41, 0.78), rgba(11, 19, 41, 0.88)), 
                        url('https://th.bing.com/th/id/R.7e1672da7740da4ef7f03dbead1b62c9?rik=bWuEnHPvNbA9fA&pid=ImgRaw&r=0') center/cover no-repeat;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px 15px;
        }

        .card-registro {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 35px 40px;
            width: 100%;
            max-width: 780px;
        }

        .form-label {
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
        }

        .caja-genero {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 16px;
        }
    </style>
</head>
<body>

    <div class="card-registro">
        
        <!-- Ícono superior recuperado -->
        <div class="text-center mb-2">
            <div class="d-inline-flex p-3 bg-success bg-opacity-10 text-success rounded-circle fs-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
        </div>

        <h3 class="fw-bold text-center text-dark mb-4">Registro de Asociado - Acerías</h3>
        
        <form id="formRegistro" action="../Modelo/guardarAsociado.php" method="POST">
            
            <div class="row g-3">
                
                <!-- DOCUMENTO: Limpio sin flechas (type="text") -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Ingresar Documento:</label>
                    <input id="documento" name="documento" type="text" class="form-control" placeholder="Ejemplo: 1025528723" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" class="form-control" required placeholder="Ej: 3131110011">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Ingrese nombres completos">
                </div>
                
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" class="form-control" required placeholder="Ingrese apellidos completos">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Fecha de nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Ciudad:</label>
                    <select id="ciudad" name="ciudad" class="form-select" required>
                        <option value="sogamoso">Sogamoso</option>
                        <option value="duitama">Duitama</option>
                        <option value="tunja">Tunja</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Dirección de residencia:</label>
                    <input type="text" id="direccionResidencia" name="direccionResidencia" class="form-control" required placeholder="Calle 11 # 10-20">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Correo:</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="Ej: ejemplo@gmail.com"> 
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="8" class="form-control" required placeholder="Ingrese su contraseña"> 
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">Confirmar Contraseña:</label>
                    <input type="password" id="confirmarPassword" name="confirmarPassword" minlength="8" class="form-control" required placeholder="Repita su contraseña"> 
                </div>

                <!-- Género alineado horizontalmente con círculos a la izquierda -->
                <div class="col-12">
                    <label class="form-label fw-semibold text-secondary d-block">Género:</label>
                    <div class="caja-genero d-flex gap-4">
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="radio" id="femenino" name="genero" value="femenino" required>
                            <label class="form-check-label small" for="femenino">Femenino</label>
                        </div>
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="radio" id="masculino" name="genero" value="masculino">
                            <label class="form-check-label small" for="masculino">Masculino</label>
                        </div>
