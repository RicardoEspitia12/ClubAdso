<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pago - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-mr {
            background-color: #0d6efd;
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Pago</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="container py-4">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
            <h4 class="mb-4">Datos del pago</h4>
            <form id="formPago" action="" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Código del préstamo</label>
                        <input type="text" id="codigoPrestamo" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de pago</label>
                        <input type="date" id="fechaPago" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Número de cuota</label>
                        <input type="number" id="numeroCuota" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Valor pagado</label>
                        <input type="number" id="valorPago" class="form-control" min="1" required>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                    <button type="submit" class="btn btn-primary">Registrar pago</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
