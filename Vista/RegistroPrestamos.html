<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Préstamos - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/formularios.css">
</head>
<body>

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Registro de Préstamos</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex align-items-center mb-4">
                            <i class="bi bi-cash-coin icono-titulo text-primary me-3"></i>
                            <div>
                                <h4 class="mb-0">Nuevo préstamo</h4>
                                <small class="text-muted">Cada asociado puede tener máximo 3 préstamos activos</small>
                            </div>
                        </div>

                        <form id="formPrestamo" action="" method="POST">
                            <div class="row g-3">

                                <div class="col-md-4">
                                    <label for="codigo" class="form-label">Código del préstamo</label>
                                    <input type="text" class="form-control" id="codigo" placeholder="Ej: P-001" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="documento" class="form-label">Documento del asociado</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="documento" placeholder="1025528723" required>
                                        <button class="btn btn-outline-primary" type="button" title="Buscar asociado">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label for="fechaPrestamo" class="form-label">Fecha del préstamo</label>
                                    <input type="date" class="form-control" id="fechaPrestamo" required>
                                </div>

                                <!-- Se muestra el nombre del asociado, solo lectura -->
                                <div class="col-12">
                                    <label for="nombreAsociado" class="form-label">Asociado</label>
                                    <input type="text" class="form-control" id="nombreAsociado"
                                           placeholder="El nombre aparecerá al buscar el documento" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label for="valor" class="form-label">Valor del préstamo</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" id="valor"
                                               min="1" max="80000000" step="1000" placeholder="Ej: 5000000" required>
                                    </div>
                                    <div class="form-text">Máximo permitido: $80.000.000</div>
                                </div>

                                <div class="col-md-3">
                                    <label for="tasa" class="form-label">Tasa de interés</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="tasa"
                                               min="0" step="0.01" placeholder="2.5" required>
                                        <span class="input-group-text">%</span>
                                    </div>
                                    <div class="form-text">Mensual</div>
                                </div>

                                <div class="col-md-3">
                                    <label for="cuotas" class="form-label">N° de cuotas</label>
                                    <input type="number" class="form-control" id="cuotas" min="1" max="120" placeholder="12" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="valorCuota" class="form-label">Valor estimado de la cuota</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="text" class="form-control" id="valorCuota" placeholder="Se calculará automáticamente" readonly>
                                    </div>
                                </div>

                            </div>

                            <hr class="my-4">

                            <div class="d-flex gap-2 justify-content-end">
                                <button type="reset" class="btn btn-outline-secondary">
                                    <i class="bi bi-eraser"></i> Limpiar
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Registrar préstamo
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
