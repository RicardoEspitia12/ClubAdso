<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Préstamos - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-mr {
            background-color: #0d6efd;
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Préstamos</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="container py-4">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
            <h4 class="mb-4">Datos del préstamo</h4>
            <form id="formPrestamo" action="" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Código del préstamo</label>
                        <input type="text" id="codigo" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Documento del asociado</label>
                        <input type="number" id="documento" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Valor del préstamo</label>
                        <input type="number" id="valor" class="form-control" min="1" max="80000000" required>
                        <div class="form-text">Máximo 80 millones de pesos</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha del préstamo</label>
                        <input type="date" id="fechaPrestamo" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tasa de interés (%)</label>
                        <input type="number" id="tasa" class="form-control" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Número de cuotas</label>
                        <input type="number" id="cuotas" class="form-control" min="1" required>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                    <button type="submit" class="btn btn-primary">Registrar préstamo</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
