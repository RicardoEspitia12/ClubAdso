<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asociados - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-mr {
            background-color: #0d6efd;
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Asociados</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="container py-4">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
            <h4 class="mb-4">Datos del asociado</h4>
            <form id="formAsociado" action="" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Documento</label>
                        <input type="number" id="documento" class="form-control" placeholder="Ej: 1025528723" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" id="fechaNacimiento" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombres</label>
                        <input type="text" id="nombres" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text" id="apellidos" class="form-control" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Dirección de residencia</label>
                        <input type="text" id="direccion" class="form-control" placeholder="Calle 11 # 10-20" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ciudad</label>
                        <select id="ciudad" class="form-select" required>
                            <option value="">Seleccione</option>
                            <option value="Sogamoso">Sogamoso</option>
                            <option value="Duitama">Duitama</option>
                            <option value="Tunja">Tunja</option>
                            <option value="Paipa">Paipa</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" placeholder="Ej: 3131110011" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo</label>
                        <input type="email" id="email" class="form-control" placeholder="ejemplo@gmail.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label d-block">Género</label>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" name="genero" id="femenino" value="femenino" required>
                            <label class="form-check-label" for="femenino">Femenino</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" name="genero" id="masculino" value="masculino">
                            <label class="form-check-label" for="masculino">Masculino</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" name="genero" id="otro" value="otro">
                            <label class="form-check-label" for="otro">Otro</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
