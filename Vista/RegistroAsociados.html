<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asociados - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/formularios.css">
</head>
<body>

    <!-- Encabezado -->
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Registro de Asociados</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card verde shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex align-items-center mb-4">
                            <i class="bi bi-people icono-titulo text-success me-3"></i>
                            <div>
                                <h4 class="mb-0">Nuevo asociado</h4>
                                <small class="text-muted">Club de asociados - Acerías</small>
                            </div>
                        </div>

                        <form id="formAsociado" action="" method="POST">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label for="documento" class="form-label">Documento</label>
                                    <input type="number" class="form-control" id="documento"
                                           placeholder="Ej: 1025528723" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                    <input type="date" class="form-control" id="fechaNacimiento" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="nombres" class="form-label">Nombres</label>
                                    <input type="text" class="form-control" id="nombres"
                                           placeholder="Ingrese nombres completos" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos"
                                           placeholder="Ingrese apellidos completos" required>
                                </div>

                                <div class="col-md-8">
                                    <label for="direccion" class="form-label">Dirección de residencia</label>
                                    <input type="text" class="form-control" id="direccion"
                                           placeholder="Ej: Calle 11 # 10-20" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="ciudad" class="form-label">Ciudad</label>
                                    <select class="form-select" id="ciudad" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Sogamoso">Sogamoso</option>
                                        <option value="Duitama">Duitama</option>
                                        <option value="Tunja">Tunja</option>
                                        <option value="Paipa">Paipa</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" class="form-control" id="telefono"
                                               placeholder="Ej: 3131110011" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email"
                                               placeholder="ejemplo@gmail.com" required>
                                    </div>
                                </div>

                                
                                <div class="col-12">
                                    <label class="form-label d-block">Género</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="genero" id="femenino" value="F" required>
                                        <label class="form-check-label" for="femenino">Femenino</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="genero" id="masculino" value="M">
                                        <label class="form-check-label" for="masculino">Masculino</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="genero" id="otro" value="O">
                                        <label class="form-check-label" for="otro">Otro</label>
                                    </div>
                                </div>

                            </div>

                            <hr class="my-4">

                            <div class="d-flex gap-2 justify-content-end">
                                <button type="reset" class="btn btn-outline-secondary">
                                    <i class="bi bi-eraser"></i> Limpiar
                                </button>
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-check-circle"></i> Guardar asociado
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
