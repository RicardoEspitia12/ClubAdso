<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asociados - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --verde: #0f766e;
            --verde-oscuro: #115e59;
            --verde-claro: #ccfbf1;
            --ambar: #f59e0b;
            --tinta: #1f2937;
            --gris: #64748b;
            --linea: #e2e8f0;
        }

        /* ===== FONDO ===== */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--tinta);
            min-height: 100vh;
            background-color: #ecfdf5 !important;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(45, 212, 191, .28) 0, transparent 38%),
                radial-gradient(circle at 88% 82%, rgba(251, 191, 36, .22) 0, transparent 36%),
                radial-gradient(rgba(15, 118, 110, .13) 1.2px, transparent 1.2px);
            background-size: auto, auto, 22px 22px;
            background-attachment: fixed;
        }

        /* ===== ENCABEZADO ===== */
        .header-mr {
            background: linear-gradient(120deg, var(--verde-oscuro) 0%, var(--verde) 60%, #14b8a6 100%) !important;
            color: #fff;
            padding: 28px 48px !important;
            border-bottom: 5px solid var(--ambar);
            box-shadow: 0 8px 24px rgba(15, 118, 110, .25);
        }
        .header-mr h3 { margin: 0; font-weight: 700; letter-spacing: .2px; }
        .header-mr .btn-light {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .55);
            border-radius: 999px;
            padding: 8px 20px;
            transition: background .2s, color .2s;
        }
        .header-mr .btn-light:hover { background: #fff; color: var(--verde-oscuro); }

        /* ===== TARJETA PRINCIPAL ===== */
        .container.py-4 { padding-top: 2.5rem !important; padding-bottom: 3rem !important; }
        .card {
            max-width: 1180px !important;
            border: 0;
            border-radius: 20px;
            padding: 2rem !important;
            box-shadow: 0 18px 45px rgba(15, 118, 110, .16) !important;
        }
        .card h5 { font-size: 1.35rem; font-weight: 700; color: var(--verde-oscuro); }
        .card .d-flex.mb-3 { margin-bottom: 1.5rem !important; }

        #contadorAsociados.badge {
            background: var(--verde-claro) !important;
            color: var(--verde-oscuro) !important;
            border-radius: 999px;
            font-weight: 600;
            padding: .5em .9em;
        }
        #nuevoAsociado {
            background: var(--ambar);
            border-color: var(--ambar);
            color: #3b2a00;
            font-weight: 600;
            border-radius: 999px;
            padding: 9px 20px;
        }
        #nuevoAsociado:hover { background: #d98a06; border-color: #d98a06; color: #fff; }

        /* ===== TABLA ===== */
        .table-responsive { border-radius: 14px; border: 1px solid var(--linea); }
        .table { --bs-table-hover-bg: #f0fdfa; margin: 0 !important; }
        .table-bordered > :not(caption) > * > * { border-width: 0 0 1px 0; border-color: var(--linea); }
        .table > :not(caption) > * > * { padding: 15px 16px; }
        .table thead.table-light th {
            background: var(--verde) !important;
            color: #fff !important;
            font-weight: 600;
            font-size: .9rem;
            border-bottom: 0;
        }
        .table tbody tr:last-child td { border-bottom: 0; }
        .table tbody tr:nth-child(even) td { background: #f8fafc; }

        /* Roles (los crea el JS con bg-danger / bg-info) */
        .badge.bg-danger { background: #fee2e2 !important; color: #b91c1c !important; border-radius: 999px; padding: .5em .9em; font-weight: 600; }
        .badge.bg-info   { background: var(--verde-claro) !important; color: var(--verde-oscuro) !important; border-radius: 999px; padding: .5em .9em; font-weight: 600; }

        /* Botones de acción */
        .btn-outline-primary { color: var(--verde); border-color: var(--verde); border-radius: 8px; }
        .btn-outline-primary:hover { background: var(--verde); border-color: var(--verde); color: #fff; }
        .btn-outline-danger { border-radius: 8px; }

        /* ===== MODAL ===== */
        .modal-content { border: 0; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 60px rgba(0, 0, 0, .25); }
        .modal-header {
            background: linear-gradient(120deg, var(--verde-oscuro), var(--verde));
            color: #fff;
            border: 0;
            padding: 20px 28px;
            border-bottom: 4px solid var(--ambar);
        }
        .modal-title { font-weight: 700; }
        .modal-header .btn-close { filter: invert(1); opacity: .9; }
        .modal-body { background: #f8fffd; padding: 26px 28px; }
        .modal-body .form-label { font-size: .85rem; font-weight: 600; color: var(--gris); margin-bottom: 4px; }
        .modal-body .form-control, .modal-body .form-select {
            border: 1.5px solid var(--linea);
            border-radius: 10px;
            padding: 10px 12px;
            background-color: #fff;
        }
        .modal-body .form-control:focus, .modal-body .form-select:focus {
            border-color: var(--verde);
            box-shadow: 0 0 0 .2rem rgba(20, 184, 166, .2);
        }
        .modal-body .form-control:disabled { background: #eef2f3; }
        .form-check-input:checked { background-color: var(--verde); border-color: var(--verde); }
        .modal-footer { background: #fff; border-top: 1px solid var(--linea); padding: 16px 28px; }
        #btnGuardarAsociado { background: var(--verde); border-color: var(--verde); border-radius: 999px; padding: 8px 26px; font-weight: 600; }
        #btnGuardarAsociado:hover { background: var(--verde-oscuro); border-color: var(--verde-oscuro); }
        .modal-footer .btn-secondary { background: transparent; color: var(--gris); border-color: var(--linea); border-radius: 999px; padding: 8px 22px; }

        @media (max-width: 768px) {
            .header-mr { padding: 20px 18px !important; }
            .card { padding: 1.2rem !important; }
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Gestión de Asociados</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="container py-4">
        <!-- TABLA DEL CRUD (LISTAR, EDITAR, ELIMINAR) -->
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 1000px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="mb-0">Asociados Registrados</h5>
                    <span class="badge bg-primary" id="contadorAsociados">0 asociados</span>
                </div>
                <button type="button" id="nuevoAsociado" class="btn btn-primary btn-sm">
                    <i class="bi bi-person-plus"></i> Nuevo asociado
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Documento</th>
                            <th>Nombre Completo</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Ciudad</th>
                            <th>Rol</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-asociados">
                        <tr>
                            <td colspan="7" class="text-center text-muted">No hay asociados registrados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL PARA NUEVO / EDITAR ASOCIADO -->
    <div class="modal fade" id="modalAsociado" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formAsociado">
                    <div class="modal-header">
                        <h5 class="modal-title" id="tituloModalAsociado">Nuevo asociado</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Documento</label>
                                <input type="number" id="documento" class="form-control" placeholder="Ej: 1025528723" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha de nacimiento</label>
                                <input type="date" id="fechaNacimiento" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nombres</label>
                                <input type="text" id="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" id="apellidos" class="form-control" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Dirección de residencia</label>
                                <input type="text" id="direccionResidencia" class="form-control" placeholder="Calle 11 # 10-20" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ciudad</label>
                                <select id="ciudad" class="form-select" required>
                                    <option value="">Seleccione</option>
                                    <option value="Sogamoso">Sogamoso</option>
                                    <option value="Duitama">Duitama</option>
                                    <option value="Tunja">Tunja</option>
                                    <option value="Paipa">Paipa</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" id="telefono" class="form-control" placeholder="Ej: 3131110011" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo</label>
                                <input type="email" id="email" class="form-control" placeholder="ejemplo@gmail.com" required>
                            </div>
                            <div class="col-md-6" id="grupoPassword">
                                <label class="form-label">Contraseña (Mínimo 8 caracteres)</label>
                                <input type="password" id="password" class="form-control" placeholder="Mínimo 8 caracteres">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Rol del usuario</label>
                                <select id="rol" class="form-select" required>
                                    <option value="asociado">Asociado</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label d-block">Género</label>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="genero" id="femenino" value="femenino" required>
                                    <label class="form-check-label" for="femenino">Femenino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="genero" id="masculino" value="masculino">
                                    <label class="form-check-label" for="masculino">Masculino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="genero" id="otro" value="otro">
                                    <label class="form-check-label" for="otro">Otro</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardarAsociado">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/Asociado.js"></script>
</body>
</html>
